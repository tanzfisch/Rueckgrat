services:
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - rueckgrat-net-local
    restart: unless-stopped

  hub:
    container_name: hub
    build:
      context: ./hub
      dockerfile: Dockerfile
    ports:
      - "14223:14223"
    volumes:
      - hub_db:/hub/db
      - hub_images:/hub/images
      - ./config:/hub/config
      - ./chat/app/common:/hub/app/common
    networks:
      - rueckgrat-net-local
    restart: unless-stopped
    stdin_open: true
    tty: true
      
  node:
    container_name: node
    build:
      context: ./node
      dockerfile: Dockerfile
    ports:
      - "7346:7346"
    volumes:
      - node_images:/node/images
      - ./config:/node/config
      - ../models:/node/models
      - ./chat/app/common:/node/app/common
    networks:
      - rueckgrat-net-local
    stdin_open: true
    tty: true
    restart: unless-stopped    
    extra_hosts:
      - "host.docker.internal:host-gateway"    

  chat:
    build:
      context: ./chat
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ../logs:/app
      - chat_cache:/chat/cache
      - chat_models:/chat/models
    stdin_open: true
    tty: true      
    restart: unless-stopped
    extra_hosts:
      - "rueckgrat.hub:192.168.2.39"
    environment:
      - TITLE=Rueckgrat
      - PIXELFLUX_WAYLAND=true
      #- HARDEN_DESKTOP=true
      #- DISABLE_OPEN_TOOLS=true
      #- DISABLE_SUDO=true
      #- DISABLE_TERMINALS=true
      #- NO_DECOR=true
      #- RESTART_APP=true
    
  llama-server:
    container_name: llama-server
    image: ghcr.io/ggml-org/llama.cpp:server-${LLAMA_CPP_SERVER}
    privileged: true
    volumes:
      - ../models:/models
    ports:
      - "${LLAMA_CPP_PORT}:${LLAMA_CPP_PORT}"
    restart: unless-stopped
    command: -m ${LLAMA_CPP_MODEL} --host 0.0.0.0 --ctx-size ${LLAMA_CPP_MAX_CONTEXT} --n-gpu-layers ${LLAMA_CPP_GPU_LAYERS}

networks:
  rueckgrat-net-local:
    external: true

volumes:
  caddy_data:
  caddy_config:
  node_images:
  hub_db:
  hub_images:
  chat_cache:
  chat_models: