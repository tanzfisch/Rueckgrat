services:
  caddy:
    container_name: rueckgrat_caddy
    build:
      context: ./caddy
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  hub:
    container_name: rueckgrat_hub
    build:
      context: ./hub
      dockerfile: Dockerfile
    ports:
      - "14223:14223"
    volumes:
      - hub_db:/hub/db
      - hub_images:/hub/images
      - ./config:/hub/config
      - ./chat/app/common:/hub/app/common
      - ${HOST_MODELS_DIR:-/var/lib/Rueckgrat/models}:/hub/models
    restart: unless-stopped
    stdin_open: true
    tty: true

  node:
    container_name: rueckgrat_node
    build:
      context: ./node
      dockerfile: Dockerfile
      args:
        INSTALL_IMAGE_GEN: ${INSTALL_IMAGE_GEN:-false}
        INSTALL_LLAMA: ${INSTALL_LLAMA:-false}
        TORCH_BACKEND: ${TORCH_BACKEND:-cpu}
        TORCH_CUDA_INDEX: ${TORCH_CUDA_INDEX:-cu121}
    ports:
      - "7346:7346"
    volumes:
      - node_images:/node/images
      - ./config:/node/config
      - ${HOST_MODELS_DIR:-/var/lib/Rueckgrat/models}:/node/models
      - ./chat/app/common:/node/app/common
    stdin_open: true
    tty: true
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"    

  llama-server:
    container_name: rueckgrat_llama_server
    image: ghcr.io/ggml-org/llama.cpp:server-${LLAMA_SERVER_BACKEND}
    privileged: true
    volumes:
      - ${HOST_MODELS_DIR:-/var/lib/Rueckgrat/models}:/models
    ports:
      - "${LLAMA_SERVER_PORT}:${LLAMA_SERVER_PORT}"
    restart: unless-stopped

    environment:
      LLAMA_ARG_MODEL: ${LLAMA_SERVER_MODEL}
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: ${LLAMA_SERVER_PORT}
      LLAMA_ARG_CTX_SIZE: ${LLAMA_SERVER_MAX_CONTEXT}
      LLAMA_ARG_N_GPU_LAYERS: ${LLAMA_SERVER_GPU_LAYERS}
      LLAMA_ARG_FLASH_ATTN: ${LLAMA_SERVER_FLASH_ATTN}
      LLAMA_ARG_TEMP: ${LLAMA_SERVER_TEMP}
      LLAMA_ARG_N_PARALLEL: ${LLAMA_SERVER_N_PARALLEL}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "exec /app/llama-server ${LLAMA_SERVER_EXTRA_ARGS:-}"

volumes:
  caddy_data:
  caddy_config:
  node_images:
  hub_db:
  hub_images:
  chat_cache: