services:
  caddy:
    container_name: rueckgrat_caddy
    build:
      context: ./caddy
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
      # caddy admin api (can rewrite the whole proxy config, no auth): this machine only
      - "127.0.0.1:2019:2019"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      HUB_PORT: ${HUB_PORT}
    restart: unless-stopped

  hub:
    container_name: rueckgrat_hub
    build:
      context: ./hub
      dockerfile: Dockerfile
    ports:
      - "${HUB_PORT}:${HUB_PORT}"
    volumes:
      - hub_db:/hub/db
      - hub_images:/hub/images
      - hub_voices:/hub/voices
      - hub_files:/hub/files
      - hub_smb:/hub/smb
      - ../characters:/hub/characters:ro
      - ./config:/hub/config
      - ./chat/app/common:/hub/app/common
      - ${HOST_MODELS_DIR:-/var/lib/Rueckgrat/models}:/hub/models
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs:/hub/logs
    group_add: ["989"]
    environment:
      SIGNUP_MODE: ${SIGNUP_MODE:-open}
      HUB_PORT: ${HUB_PORT}
      HUB_SECRET_KEY: ${HUB_SECRET_KEY:-}
      HUB_DOCS: ${HUB_DOCS:-false}
      HUB_FILE_SHARE: ${HUB_FILE_SHARE:-none}
      HUB_FILE_SHARE_EXCLUDE: ${HUB_FILE_SHARE_EXCLUDE:-}
      HUB_SMB_PORT: ${HUB_SMB_PORT:-445}
      HUB_FETCH_ALLOW: ${HUB_FETCH_ALLOW:-}
      NOMAD_URL: ${NOMAD_URL:-}
      HUB_MAINTENANCE_START: ${HUB_MAINTENANCE_START:-02:00}
      HUB_MAINTENANCE_END: ${HUB_MAINTENANCE_END:-05:00}
      HUB_MAINTENANCE_BATCH: ${HUB_MAINTENANCE_BATCH:-50}
      HUB_MAINTENANCE_INTERVAL: ${HUB_MAINTENANCE_INTERVAL:-15}
      HUB_MAINTENANCE_SMALL_BATCH: ${HUB_MAINTENANCE_SMALL_BATCH:-10}
      HUB_TASKS_MAX: ${HUB_TASKS_MAX:-20}
      HUB_TASKS_MIN_INTERVAL: ${HUB_TASKS_MIN_INTERVAL:-15}
      HUB_JOB_WORKER_CALLS: ${HUB_JOB_WORKER_CALLS:-100}
      HUB_JOB_WORKER_MINUTES: ${HUB_JOB_WORKER_MINUTES:-30}
      HUB_JOB_WORKER_JSON: ${HUB_JOB_WORKER_JSON:-true}
      HUB_SANDBOX_RUNTIME: ${HUB_SANDBOX_RUNTIME:-runsc}
      HUB_SANDBOX_IDLE_MINUTES: ${HUB_SANDBOX_IDLE_MINUTES:-1440}
      HUB_SANDBOX_BACKUP_MAX_MB: ${HUB_SANDBOX_BACKUP_MAX_MB:-0}
      LLAMA_SERVER_MAX_CONTEXT: ${LLAMA_SERVER_MAX_CONTEXT:-}
      LLAMA_SERVER_N_PARALLEL: ${LLAMA_SERVER_N_PARALLEL:-}
      RUECKGRAT_TRACE: ${RUECKGRAT_TRACE:-}
    restart: unless-stopped
    stdin_open: true
    tty: true

  # #225 the contacts' files as SMB shares (HUB_FILE_SHARE=smb): the hub keeps its users and shares in hub_smb (writable:
  # samba sets its smbpasswd to 0600 at each read). docker's volumes folder (the contacts' volumes in it), the local
  # network only (smb.conf), IPv4, on HUB_SMB_PORT (445 unless taken)
  smb:
    container_name: rueckgrat_smb
    build:
      context: ./smb
      dockerfile: Dockerfile
    profiles: ["smb"]
    ports:
      - "0.0.0.0:${HUB_SMB_PORT:-445}:445"
    volumes:
      - hub_smb:/state
      - ${HUB_SMB_VOLUMES:-/var/lib/docker/volumes}:/volumes
    depends_on:
      - hub
    restart: unless-stopped

  # #227 the image of the contacts' sandbox containers and of the hub's reader and backup containers
  # (SandboxVolume.SANDBOX_IMAGE): python 3.11 on debian trixie with SDL2, cmake, ninja, the python libraries and sudo.
  # built only (docker compose --profile sandbox build sandbox), the hub starts its containers itself, nothing runs this
  # service
  sandbox:
    image: rueckgrat-sandbox:latest
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    profiles: ["sandbox"]

  cloudflared:
    container_name: rueckgrat_cloudflared
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    extra_hosts:
      - "${HUB_HOST:-rueckgrat.hub}:${CLOUDFLARE_HUB_ADDR:-host-gateway}"
    profiles: ["cloudflare"]
    depends_on:
      - caddy
    restart: unless-stopped

  node:
    container_name: rueckgrat_node
    build:
      context: ./node
      dockerfile: Dockerfile
      args:
        INSTALL_IMAGE_GEN: ${INSTALL_IMAGE_GEN:-false}
        INSTALL_TTS: ${INSTALL_TTS:-false}
        INSTALL_STT: ${INSTALL_STT:-false}
        INSTALL_EMBEDDING: ${INSTALL_EMBEDDING:-false}
        INSTALL_DECISION: ${INSTALL_DECISION:-false}
        INSTALL_LLAMA: ${INSTALL_LLAMA:-false}
        TORCH_BACKEND: ${TORCH_BACKEND:-cpu}
        TORCH_CUDA_INDEX: ${TORCH_CUDA_INDEX:-cu121}
    ports:
      - "${NODE_PORT}:${NODE_PORT}"
    volumes:
      - node_images:/node/images
      - ./config:/node/config
      - ${HOST_MODELS_DIR:-/var/lib/Rueckgrat/models}:/node/models
      - node_voices:/node/voices
      - ./chat/app/common:/node/app/common
    environment:
      NODE_PORT: ${NODE_PORT}
      LLAMA_SERVER_PORT: ${LLAMA_SERVER_PORT}
      TTS_MODEL: ${TTS_MODEL:-chatterbox}
      STT_WORKERS: ${STT_WORKERS:-4}
    stdin_open: true
    tty: true
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"    

  llama-server:
    container_name: rueckgrat_llama_server
    image: ghcr.io/ggml-org/llama.cpp:server-${LLAMA_SERVER_BACKEND}
    privileged: true
    volumes:
      - ${HOST_MODELS_DIR:-/var/lib/Rueckgrat/models}:/models
    ports:
      - "${LLAMA_SERVER_PORT}:${LLAMA_SERVER_PORT}"
    restart: unless-stopped

    environment:
      LLAMA_ARG_MODEL: ${LLAMA_SERVER_MODEL}
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: ${LLAMA_SERVER_PORT}
      LLAMA_ARG_CTX_SIZE: ${LLAMA_SERVER_MAX_CONTEXT}
      LLAMA_ARG_N_GPU_LAYERS: ${LLAMA_SERVER_GPU_LAYERS}
      LLAMA_ARG_FLASH_ATTN: ${LLAMA_SERVER_FLASH_ATTN}
      LLAMA_ARG_TEMP: ${LLAMA_SERVER_TEMP}
      LLAMA_ARG_N_PARALLEL: ${LLAMA_SERVER_N_PARALLEL}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "exec /app/llama-server ${LLAMA_SERVER_EXTRA_ARGS:-}"

volumes:
  caddy_data:
  caddy_config:
  node_images:
  node_voices:
  hub_db:
  hub_images:
  hub_voices:
  hub_files:
  hub_smb:
  chat_cache: